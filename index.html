<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعم الفيديو ❤️</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0b0b0e; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .card { background: #16161d; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; max-width: 400px; margin: auto; }
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; background: linear-gradient(135deg, #e1306c, #f56040); color: #fff; border: none; padding: 14px; margin: 10px 0; border-radius: 12px; font-weight: bold; text-decoration: none; cursor: pointer; font-size: 0.95rem; }
        .btn-alt { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }
        .reel-container { margin: 15px 0; border-radius: 12px; overflow: hidden; background: #000; }
    </style>
</head>
<body>

<div class="card">
    <h2>شاهد وادعم الفيديو ❤️</h2>
    <p style="color: #a1a1a6; font-size: 0.85rem;">يمكنك مشاهدة الفيديو هنا، واستخدام الأزرار بالأسفل للتفاعل السريع داخل تطبيق إنستغرام.</p>

    <!-- تضمين الفيديو للعرض المباشر -->
    <div class="reel-container">
        <iframe src="https://www.instagram.com/reel/DcLf7XPMrpT/embed" width="100%" height="480" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
    </div>

    <!-- أزرار التفاعل السريع -->
    <button class="btn" onclick="copyCommentAndOpen()">💬 نسخ التعليق (❤️) والتفاعل</button>
    <a href="https://www.instagram.com/reel/DcLf7XPMrpT/" target="_blank" class="btn btn-alt">📲 فتح الفيديو للتفاعل والمشاركة</a>
</div>

<script>
function copyCommentAndOpen() {
    navigator.clipboard.writeText("❤️");
    alert("تم نسخ التعليق ❤️! سيتم تحويلك الآن للتطبيق لتضعه وتتفاعل مع الفيديو.");
    window.location.href = "instagram://media?id=DcLf7XPMrpT";
    setTimeout(() => {
        window.location.href = "https://www.instagram.com/reel/DcLf7XPMrpT/";
    }, 1000);
}
</script>

</body>
</html>
