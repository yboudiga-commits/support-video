<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دعم الفيديو ❤️</title>
    <!-- خط تجسيد حديث -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: rgba(22, 22, 29, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --ig-button: linear-gradient(135deg, #e1306c 0%, #fd1d1d 50%, #f56040 100%);
            --accent-blue: #0095f6;
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(225, 48, 108, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(188, 24, 136, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .icon-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--ig-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(225, 48, 108, 0.3);
        }

        .icon-badge svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.description {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .actions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 24px 0;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 18px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--ig-button);
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(245, 96, 64, 0.25);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 24px rgba(245, 96, 64, 0.4);
            filter: brightness(1.05);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ffffff;
            color: #000000;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .footer-note {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 20px;
            border-top: 1px solid var(--card-border);
            padding-top: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon-badge">
            <svg viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
        </div>
        <h1>شنو غادي يوقع ملي تضغط؟ 👇</h1>
        <p class="description">هاد الصفحة معمولها باش يسهل عليك دعم الفيديو. بضغطة زر، غادي تفتح الفيديو مباشرة داخل تطبيق إنستغرام.</p>
    </div>

    <div class="actions-list">
        <button class="btn btn-primary" onclick="handleAction('❤️')">
            <span>1. نسخ التعليق (❤️) وفتح الفيديو</span>
        </button>

        <a href="https://www.instagram.com/reel/DcLf7XPMrpT/" target="_blank" class="btn btn-secondary">
            <span>2. فتح الفيديو في إنستغرام مباشرة</span>
        </a>
    </div>

    <div class="footer-note">
        شكراً على المساهمة في نشر الفيديو ❤️
    </div>
</div>

<div id="toast" class="toast">تم نسخ التعليق ❤️! جاري الفتح...</div>

<script>
function triggerHaptic() {
    if ("vibrate" in navigator) {
        navigator.vibrate(40); // اهتزاز خفيف جداً للتفاعل
    }
}

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 2500);
}

function handleAction(textToCopy) {
    triggerHaptic();
    
    // نسخ النص للحافظة
    navigator.clipboard.writeText(textToCopy).then(() => {
        showToast("تم نسخ التعليق ❤️! جاري الفتح...");
    }).catch(() => {
        // دعم الأجهزة القديمة
        const el = document.createElement('textarea');
        el.value = textToCopy;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        showToast("تم نسخ التعليق ❤️! جاري الفتح...");
    });

    // التوجيه المباشر للتطبيق
    setTimeout(() => {
        window.location.href = "instagram://media?id=DcLf7XPMrpT";
        
        // Fallback في حالة عدم فتح التطبيق
        setTimeout(() => {
            window.location.href = "https://www.instagram.com/reel/DcLf7XPMrpT/";
        }, 1200);
    }, 400);
}
</script>

</body>
</html>
